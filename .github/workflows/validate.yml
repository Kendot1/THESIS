name: Validate FOODCAST changes

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Offline tests construct a client but never contact this URL.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: offline-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: model_trainer/requirements.txt
      - name: Install model dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r model_trainer/requirements.txt
      - name: Test causal pipeline and calibration
        working-directory: model_trainer
        run: python -m unittest discover -s tests -v

  frontend_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm
          cache-dependency-path: foodcast/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: foodcast
        run: pnpm install --frozen-lockfile
      - name: Check frontend types
        working-directory: foodcast
        run: pnpm exec tsc --noEmit --incremental false
      - name: Test forecast quality and capability display
        run: node --experimental-strip-types --test foodcast/tests/dashboard.test.mjs foodcast/tests/forecast-workflow.test.mjs supabase/functions/foodcast/quality.test.mjs supabase/functions/foodcast/status.test.mjs supabase/functions/foodcast/forecast.test.mjs foodcast/app/lib/model-quality.test.mjs foodcast/app/lib/forecast-horizons.test.mjs
