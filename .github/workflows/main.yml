name: Automated Data Scrapers

on:
  schedule:
    # Run the DA price fetch + downstream model pipeline daily at 1:00 AM Philippine Time (17:00 UTC).
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodcast-daily-pipeline
  cancel-in-progress: false

jobs:
  scrape_da_prices:
    name: Scrape DA Historical Prices
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY_DA_PARSER: ${{ secrets.GEMINI_API_KEY_DA_PARSER }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt

      - name: Run DA PDF Scraper
        run: python scraper/main.py

  scrape_news:
    name: Scrape Market News
    runs-on: ubuntu-latest
    needs: scrape_da_prices
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GROQ_API_KEY_NEWS_SCRAPER: ${{ secrets.GROQ_API_KEY_NEWS_SCRAPER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        env:
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt
          crawl4ai-setup

      - name: Run News Scraper
        env:
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}
        run: python -m scraper.news_scraper

  train_model:
    name: Train Candidate and Publish Forecasts
    runs-on: ubuntu-latest
    needs: [scrape_da_prices, scrape_news]
    # News enriches training but is optional; only DA price scrape is required.
    if: ${{ always() && needs.scrape_da_prices.result == 'success' }}
    timeout-minutes: 360
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: model_trainer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r model_trainer/requirements.txt

      - name: Verify publication schema
        working-directory: model_trainer
        run: python main.py check

      - name: Restore active v2 model
        working-directory: model_trainer
        run: python -m utils.r2_sync download

      - name: Set Manila report-date cutoff
        id: cutoff
        run: echo "date=$(TZ=Asia/Manila date +%F)" >> "$GITHUB_OUTPUT"

      # Train a point-in-time candidate on the refreshed price history. Keep it
      # staged until it has independent frozen-holdout evidence and review.
      - name: Train and evaluate candidate
        id: train_candidate
        working-directory: model_trainer
        shell: bash
        run: |
          set -o pipefail
          python main.py train --mode full \
            --through "${{ steps.cutoff.outputs.date }}" \
            --report-date-as-of --no-activate \
            --result-json candidate_training_result.json \
            | tee candidate_training_output.log
          run_id="$(python -c 'import json; print(json.load(open("candidate_training_result.json", encoding="utf-8"))["run_id"])')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Archive trained candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: foodcast-model-candidate-${{ steps.train_candidate.outputs.run_id }}
          path: |
            model_trainer/artifacts_v2/runs/${{ steps.train_candidate.outputs.run_id }}
            model_trainer/candidate_training_result.json
            model_trainer/candidate_training_output.log
          if-no-files-found: error
          retention-days: 30

      # Publish with the reviewed active bundle. Candidate promotion remains
      # behind the independent holdout gate in the model pipeline.
      - name: Publish forecasts and measured model capability
        working-directory: model_trainer
        run: python main.py predict --horizon monthly

      - name: Trigger Vercel Rebuild
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
