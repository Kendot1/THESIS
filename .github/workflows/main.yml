name: Automated Data Scrapers

on:
  schedule:
    # Run the DA Historical PDF scraper every day at 1 AM UTC
    - cron: "0 1 * * *"
    # Run the News Scraper every day at 2 AM UTC
    - cron: "0 2 * * *"
    # Run the Smart Daily Trainer every day at 3 AM UTC (after scrapers)
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape_da_prices:
    name: Scrape DA Historical Prices
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 1 * * *' || github.event_name == 'workflow_dispatch'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY_DA_PARSER: ${{ secrets.GEMINI_API_KEY_DA_PARSER }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt

      - name: Run DA PDF Scraper
        run: python scraper/main.py

  scrape_news:
    name: Scrape Market News
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GROQ_API_KEY_NEWS_SCRAPER: ${{ secrets.GROQ_API_KEY_NEWS_SCRAPER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run News Scraper
        run: python scraper/news_scraper.py

  train_model:
    name: Daily Model Training
    runs-on: ubuntu-latest
    needs: [scrape_da_prices, scrape_news]
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r model_trainer/requirements.txt

      - name: Run Smart Daily Training Pipeline
        run: |
          # Create .env dynamically for the model trainer
          echo "SUPABASE_URL=${SUPABASE_URL}" > model_trainer/.env
          echo "SUPABASE_KEY=${SUPABASE_KEY}" >> model_trainer/.env
          echo "CLOUDFLARE_R2_ACCOUNT_ID=${CLOUDFLARE_R2_ACCOUNT_ID}" >> model_trainer/.env
          echo "CLOUDFLARE_R2_ACCESS_KEY_ID=${CLOUDFLARE_R2_ACCESS_KEY_ID}" >> model_trainer/.env
          echo "CLOUDFLARE_R2_SECRET_ACCESS_KEY=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}" >> model_trainer/.env
          echo "CLOUDFLARE_R2_BUCKET_NAME=${CLOUDFLARE_R2_BUCKET_NAME}" >> model_trainer/.env
          echo "CLOUDFLARE_R2_PUBLIC_URL=${CLOUDFLARE_R2_PUBLIC_URL}" >> model_trainer/.env
          
          cd model_trainer
          
          # 1. Download previous artifacts (state persistence)
          python utils/r2_sync.py download
          
          # 2. Run the pipeline in daily mode (auto-detects drift)
          python main.py train --mode daily
          
          # 3. Generate predictions and write to Supabase
          python main.py predict --horizon monthly
          
          # 4. Upload new artifacts to R2 for tomorrow
          python utils/r2_sync.py upload
