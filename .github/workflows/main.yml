name: Automated Data Scrapers

on:
  schedule:
    # Run the DA price fetch + downstream model pipeline daily at 1:00 AM Philippine Time (17:00 UTC).
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foodcast-daily-pipeline
  cancel-in-progress: false

jobs:
  scrape_da_prices:
    name: Scrape DA Historical Prices
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY_DA_PARSER: ${{ secrets.GEMINI_API_KEY_DA_PARSER }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt

      - name: Run DA PDF Scraper
        run: python scraper/main.py

  scrape_news:
    name: Scrape Market News
    runs-on: ubuntu-latest
    needs: scrape_da_prices
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GROQ_API_KEY_NEWS_SCRAPER: ${{ secrets.GROQ_API_KEY_NEWS_SCRAPER }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        env:
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scraper/requirements.txt
          crawl4ai-setup

      - name: Run News Scraper
        env:
          CRAWL4_AI_BASE_DIRECTORY: ${{ runner.temp }}
        run: python -m scraper.news_scraper

  train_model:
    name: Daily Forecast Publication
    runs-on: ubuntu-latest
    needs: scrape_da_prices
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
      CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
      CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r model_trainer/requirements.txt

      - name: Verify publication schema
        working-directory: model_trainer
        run: python main.py check

      - name: Verify model pipeline
        working-directory: model_trainer
        run: python -m unittest discover -s tests -v

      - name: Restore active v2 model
        working-directory: model_trainer
        run: python -m utils.r2_sync download

      # Keep training/evaluation separate from live inference. An unrestricted
      # daily retrain would score reserved prospective holdout dates as they
      # arrive. New candidates require a declared development cutoff and review.
      - name: Publish forecasts and measured model capability
        working-directory: model_trainer
        run: python main.py predict --horizon monthly

      - name: Trigger Vercel Rebuild
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
